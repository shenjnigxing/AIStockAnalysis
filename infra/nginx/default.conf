worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream stock_web {
    server web:3000;
  }

  upstream stock_api {
    server api:8000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://stock_api;
    }

    location / {
      proxy_pass http://stock_web;
    }
  }
}
