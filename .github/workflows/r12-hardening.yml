name: R1.2 Ten-Role Hardening & Home Acceptance
on:
  push:
    branches: [feat/r12-ten-role-hardening]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/e2e/dataset-releases.integration.spec.ts"
      - "tests/e2e/public-quotes.integration.spec.ts"
      - "tests/e2e/r12-home.spec.ts"
      - ".github/workflows/r12-hardening.yml"
permissions:
  contents: write
jobs:
  security-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r12-ten-role-hardening
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Upgrade vulnerable transitive versions without Next 16
        working-directory: apps/web
        run: |
          npm ci
          npm pkg set 'overrides.nanoid=3.3.20' 'overrides.postcss=8.5.25' 'overrides.source-map-js=1.2.2'
          npm install
          npx tsc --noEmit
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Publish only lockfile changes verified by build and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(r12): lock audited safe versions of transitive packages"
            git push origin HEAD:feat/r12-ten-role-hardening
          fi
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Shared module path
        shell: bash
        run: |
          modules=$(find "$GITHUB_WORKSPACE/services" -mindepth 1 -maxdepth 1 -type d | paste -sd ':' -)
          echo "PYTHONPATH=$GITHUB_WORKSPACE/apps/api:$modules" >> "$GITHUB_ENV"
      - name: Full backend and home/operator acceptance
        run: python -m pytest -q apps/api/tests
      - name: Verify R1 routes registered
        run: python -c "from app.main import app; assert any(r.path=='/api/research/v3/datasets/readiness' for r in app.routes)"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  fullstack:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      API_BASE_URL: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r apps/api/requirements.txt
      - run: |
          npm ci
          npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          modules=$(find "$GITHUB_WORKSPACE/services" -mindepth 1 -maxdepth 1 -type d | paste -sd ':' -)
          export PYTHONPATH="$GITHUB_WORKSPACE/apps/api:$modules"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/aistock-r1-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/aistock-r1-api.log
          exit 1
      - name: Real FastAPI + Chromium V3/R1/R1.1/R1.2 journeys
        run: npx playwright test tests/e2e/dataset-releases.integration.spec.ts tests/e2e/public-quotes.integration.spec.ts tests/e2e/multi-asset.integration.spec.ts tests/e2e/r12-home.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-evening-smoke-visual-proof
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse Windows scripts for PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @("scripts/setup-windows.ps1","scripts/dev-windows.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax errors in $path" }
          }
      - name: First-run Windows setup and offline doctor
        shell: pwsh
        run: |
          & .\scripts\setup-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows setup/doctor failed" }
      - name: Quote cache unavailable before manual refresh
        shell: pwsh
        run: |
          $script = (Resolve-Path "scripts/dev-windows.ps1").Path
          $arguments = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $script, "-Mode", "status", "-Kind", "us_equity", "-Symbol", "AAPL")
          $process = Start-Process -FilePath "pwsh" -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 3) { throw "Expected no pre-filled public quote, got exit code $($process.ExitCode)" }
