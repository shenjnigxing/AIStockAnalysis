name: Multi-asset V3 validation
on:
  push:
    branches: [feat/multi-asset-research-v3]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/e2e/multi-asset.integration.spec.ts"
      - ".github/workflows/multi-asset-v3.yml"
jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Configure shared modules
        shell: bash
        run: |
          modules=$(find "$GITHUB_WORKSPACE/services" -mindepth 1 -maxdepth 1 -type d | paste -sd ':' -)
          echo "PYTHONPATH=$GITHUB_WORKSPACE/apps/api:$modules" >> "$GITHUB_ENV"
      - name: Full backend regression
        run: python -m pytest -q apps/api/tests
      - name: V3 routes registered
        run: python -c "from app.main import app; assert any(r.path=='/api/research/v3/evaluate' for r in app.routes)"
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  fullstack:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "sqlite:///:memory:"
      API_BASE_URL: "http://127.0.0.1:8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r apps/api/requirements.txt
      - run: |
          npm ci
          npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - name: Start FastAPI
        run: |
          modules=$(find "$GITHUB_WORKSPACE/services" -mindepth 1 -maxdepth 1 -type d | paste -sd ':' -)
          export PYTHONPATH="$GITHUB_WORKSPACE/apps/api:$modules"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/aistock-v3-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/aistock-v3-api.log
          exit 1
      - name: V3 real fullstack Chromium workflow
        run: npx playwright test tests/e2e/multi-asset.integration.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-multi-asset-visual-proof
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
